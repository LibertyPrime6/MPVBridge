; MPVBridge sample configuration.
; For Chinese Name/Path values, save this file as UTF-16 LE with BOM so the
; native Windows profile APIs preserve every Unicode character.

[General]
DefaultProfile=HQ_Anime
EnableLogging=0
AutoLaunchSeconds=3

[HQ_Anime]
Order=0
Name=HQ Anime (Anime4K + Custom Shaders)
Path=C:\Tools\MPV_HQ\mpv.exe

[Light_Player]
Order=1
Name=Light Player (No scripts / Fast startup)
Path=C:\Tools\MPV_Light\mpv.exe
